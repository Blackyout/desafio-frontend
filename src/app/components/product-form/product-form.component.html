<div class="container">
  <div class="header">
    <h1>{{ isEditMode ? 'Editar Producto' : 'Nuevo Producto' }}</h1>
    <a routerLink="/products" class="btn btn-outline">Volver</a>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div class="form-container">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nombre *</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          class="input"
          [class.error]="getFieldError('name')"
        />
        <span *ngIf="getFieldError('name')" class="error-text">
          {{ getFieldError('name') }}
        </span>
      </div>

      <div class="form-group">
        <label for="sku">SKU *</label>
        <input
          id="sku"
          type="text"
          formControlName="sku"
          class="input"
          [class.error]="getFieldError('sku')"
          placeholder="ej: PROD-001"
        />
        <span *ngIf="getFieldError('sku')" class="error-text">
          {{ getFieldError('sku') }}
        </span>
      </div>

      <div class="form-group">
        <label for="price">Precio *</label>
        <input
          id="price"
          type="number"
          formControlName="price"
          class="input"
          [class.error]="getFieldError('price')"
          min="0"
          step="0.01"
        />
        <span *ngIf="getFieldError('price')" class="error-text">
          {{ getFieldError('price') }}
        </span>
      </div>

      <div class="form-group">
        <label for="owner">Propietario (opcional)</label>
        <select
          id="owner"
          formControlName="owner"
          class="select"
          [disabled]="loadingPersons"
        >
          <option [ngValue]="null">Sin propietario</option>
          <option *ngFor="let person of persons" [ngValue]="person.id">
            {{ person.first_name }} {{ person.last_name }} ({{ person.email }})
          </option>
        </select>
        <span *ngIf="loadingPersons" class="help-text">Cargando personas...</span>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loading"
        >
          {{ loading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
        </button>
        <a routerLink="/products" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
