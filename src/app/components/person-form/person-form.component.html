<div class="container">
  <div class="header">
    <h1>{{ isEditMode ? 'Editar Persona' : 'Nueva Persona' }}</h1>
    <a routerLink="/persons" class="btn btn-outline">Volver</a>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div class="form-container">
    <form [formGroup]="personForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="first_name">Nombre *</label>
        <input
          id="first_name"
          type="text"
          formControlName="first_name"
          class="input"
          [class.error]="getFieldError('first_name')"
        />
        <span *ngIf="getFieldError('first_name')" class="error-text">
          {{ getFieldError('first_name') }}
        </span>
      </div>

      <div class="form-group">
        <label for="last_name">Apellido *</label>
        <input
          id="last_name"
          type="text"
          formControlName="last_name"
          class="input"
          [class.error]="getFieldError('last_name')"
        />
        <span *ngIf="getFieldError('last_name')" class="error-text">
          {{ getFieldError('last_name') }}
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="input"
          [class.error]="getFieldError('email')"
        />
        <span *ngIf="getFieldError('email')" class="error-text">
          {{ getFieldError('email') }}
        </span>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loading"
        >
          {{ loading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
        </button>
        <a routerLink="/persons" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
